<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Safari pinned-tab mask icon: single-colour "M" monogram.
     Safari ignores fill colours here and applies the `color` attribute from
     the <link rel="mask-icon"> tag, so everything must be one solid shape. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"
     width="512" height="512" preserveAspectRatio="xMidYMid meet">
  <path fill="#000000" d="M80 412 L80 100 L164 100 L256 268 L348 100 L432 100
                          L432 412 L358 412 L358 234 L286 362 L226 362
                          L154 234 L154 412 Z"/>
</svg>
